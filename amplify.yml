version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@10 --activate
        - pnpm install
    build:
      commands:
        - echo "KIT_API_KEY=$KIT_API_KEY" >> .env
        - echo "KIT_FORM_ID=$KIT_FORM_ID" >> .env
        - echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
